<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alfabetização">
<meta name="robots" content="noindex">
<title>Brincadeiras de Alfabetização</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FFF9F0;
    --surface: #FFFFFF;
    --ink: #1F2A44;
    --muted: #5B6478;
    --blue: #2F5BEA;
    --blue-dark: #1E44C4;
    --blue-soft: #E8EEFF;
    --yellow: #FFC93C;
    --yellow-soft: #FFF3CF;
    --coral: #FF6B57;
    --coral-soft: #FFE6E2;
    --green: #16A34A;
    --green-dark: #128A3E;
    --green-soft: #DCF5E5;
    --purple: #8B5CF6;
    --purple-soft: #EFE8FF;
    --line: #EDE6DA;
    --radius: 20px;
    --shadow: 0 4px 0 rgba(31, 42, 68, .08), 0 6px 16px rgba(31, 42, 68, .06);
    --nav-h: 72px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; user-select: text; -webkit-user-select: text; }
  h1, h2, h3, .f { font-family: 'Fredoka', 'Inter', sans-serif; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100%; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); }
  .app.has-nav { padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
  .screen { animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* TOPO */
  .top {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 0 12px;
  }
  .top h1 { font-size: 1.25rem; flex: 1; line-height: 1.1; min-width: 0; }
  .top h1 small { display: block; font: 500 .8rem 'Inter', sans-serif; color: var(--muted); margin-top: 2px; }
  .back, .avatar {
    width: 46px; height: 46px; border-radius: 14px; background: var(--surface);
    box-shadow: var(--shadow); font-size: 1.5rem; display: grid; place-items: center; flex-shrink: 0;
  }
  .stars-pill {
    background: var(--yellow-soft); color: #8A5A00; font: 700 1rem 'Fredoka', sans-serif;
    padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  }

  /* NAVEGACAO INFERIOR */
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
  .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 .78rem 'Fredoka', sans-serif; color: var(--muted); }
  .nav button span { font-size: 1.6rem; line-height: 1; filter: grayscale(.6); opacity: .7; transition: transform .15s; }
  .nav button.on { color: var(--blue); }
  .nav button.on span { filter: none; opacity: 1; transform: translateY(-2px) scale(1.1); }

  /* MASCOTE E TRILHA */
  .hero {
    background: var(--blue); color: #fff; border-radius: var(--radius);
    padding: 18px; margin: 4px 0 14px; box-shadow: 0 6px 0 var(--blue-dark);
  }
  .hero-row { display: flex; gap: 12px; align-items: flex-end; }
  .mascot { font-size: 3.6rem; line-height: 1; animation: bob 2.4s ease-in-out infinite; flex-shrink: 0; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
  .bubble {
    background: #fff; color: var(--ink); border-radius: 16px 16px 16px 4px;
    padding: 10px 14px; font: 600 .98rem 'Fredoka', sans-serif; line-height: 1.3; flex: 1;
  }
  .trail { margin-top: 16px; }
  .trail-top { display: flex; justify-content: space-between; font: 600 .85rem 'Fredoka', sans-serif; opacity: .95; margin-bottom: 6px; }
  .bar { height: 12px; background: rgba(255, 255, 255, .25); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--yellow); border-radius: 999px; transition: width .6s; }
  .bar.light { background: var(--line); }
  .continue {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px;
    background: var(--yellow); color: var(--ink); font: 700 1.1rem 'Fredoka', sans-serif;
    padding: 14px; border-radius: 16px; box-shadow: 0 5px 0 #D99A00;
  }
  .continue:active { transform: translateY(3px); box-shadow: 0 2px 0 #D99A00; }

  /* DESAFIO DO DIA */
  .daily {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: var(--surface); border: 3px solid var(--yellow); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 6px;
  }
  .daily .ico { font-size: 2.4rem; }
  .daily h3 { font-size: 1.1rem; }
  .daily p { font-size: .82rem; color: var(--muted); }
  .daily .go { margin-left: auto; font: 700 .9rem 'Fredoka', sans-serif; background: var(--yellow); padding: 8px 12px; border-radius: 12px; white-space: nowrap; }
  .daily.done { border-color: var(--green); }
  .daily.done .go { background: var(--green-soft); color: var(--green); }

  /* LISTA DE BRINCADEIRAS */
  .section-title { display: flex; align-items: center; gap: 8px; font: 700 1rem 'Fredoka', sans-serif; color: var(--muted); margin: 20px 4px 10px; text-transform: uppercase; letter-spacing: .5px; }
  .section-title b { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: .85rem; }
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px;
    min-height: 156px; transition: transform .12s; position: relative; border: 3px solid transparent;
  }
  .game:active { transform: scale(.96); }
  .game.next { border-color: var(--yellow); }
  .game .flag { position: absolute; top: -10px; right: 10px; background: var(--yellow); font: 700 .7rem 'Fredoka', sans-serif; padding: 3px 8px; border-radius: 999px; }
  .game .ico { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 1.9rem; margin-bottom: 4px; }
  .game h3 { font-size: 1.05rem; line-height: 1.15; }
  .game p { font-size: .8rem; color: var(--muted); line-height: 1.3; }
  .game .best { margin-top: auto; font-size: .85rem; letter-spacing: 1px; color: var(--muted); }
  .c-blue .ico { background: var(--blue-soft); }
  .c-yellow .ico { background: var(--yellow-soft); }
  .c-coral .ico { background: var(--coral-soft); }
  .c-green .ico { background: var(--green-soft); }
  .c-purple .ico { background: var(--purple-soft); }

  /* JOGO */
  .progress { display: flex; gap: 6px; margin: 4px 0 18px; }
  .progress i { flex: 1; height: 10px; border-radius: 999px; background: var(--line); }
  .progress i.done { background: var(--green); }
  .progress i.miss { background: var(--yellow); }
  .progress i.now { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 22px 18px; text-align: center; margin-bottom: 18px;
  }
  .question { font: 600 1.25rem 'Fredoka', sans-serif; margin-bottom: 12px; }
  .emoji { font-size: 6rem; line-height: 1.1; }
  .emoji.pop, .pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .word { font: 700 2.4rem 'Fredoka', sans-serif; letter-spacing: 2px; margin-top: 8px; }
  .word .blank { display: inline-block; min-width: 2.2em; border-bottom: 5px solid var(--blue); color: var(--blue); }
  .speak {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
    background: var(--blue-soft); color: var(--blue); font: 600 1rem 'Fredoka', sans-serif;
    padding: 10px 18px; border-radius: 999px;
  }
  .options { display: grid; gap: 12px; }
  .options.cols-1 { grid-template-columns: 1fr; }
  .options.cols-2 { grid-template-columns: 1fr 1fr; }
  .options.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .opt {
    background: var(--surface); border: 3px solid var(--line); border-radius: var(--radius);
    min-height: 88px; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font: 700 2rem 'Fredoka', sans-serif; box-shadow: 0 5px 0 var(--line); transition: transform .1s;
  }
  .cols-1 .opt { min-height: 72px; font-size: 1.9rem; letter-spacing: 2px; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  .opt small { font: 600 .95rem 'Fredoka', sans-serif; color: var(--muted); letter-spacing: 1px; }
  .opt .e { font-size: 2.8rem; line-height: 1; }
  .opt.right, .tile.right { border-color: var(--green); background: var(--green-soft); box-shadow: 0 5px 0 var(--green); }
  .opt.wrong, .tile.wrong { border-color: var(--coral); background: var(--coral-soft); animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .feedback { text-align: center; font: 700 1.2rem 'Fredoka', sans-serif; min-height: 1.6em; margin-top: 14px; }
  .feedback.ok { color: var(--green); }
  .feedback.no { color: var(--coral); }

  /* MONTE A PALAVRA */
  .slots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .slot {
    min-width: 76px; height: 64px; border-radius: 14px; border: 3px dashed var(--line);
    display: grid; place-items: center; font: 700 1.9rem 'Fredoka', sans-serif; color: var(--blue);
  }
  .slot.filled { border-style: solid; border-color: var(--blue); background: var(--blue-soft); animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .tile {
    min-width: 92px; height: 76px; padding: 0 14px; background: var(--surface); border: 3px solid var(--line);
    border-radius: 18px; box-shadow: 0 5px 0 var(--line); font: 700 2rem 'Fredoka', sans-serif;
  }
  .tile.used { opacity: .25; pointer-events: none; }

  /* EXPLORAR: ALFABETO E FAMILIAS */
  .letters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .letter {
    aspect-ratio: 1; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
    font: 700 2rem 'Fredoka', sans-serif; display: grid; place-items: center; transition: transform .12s;
  }
  .letter:nth-child(5n+1) { color: var(--blue); }
  .letter:nth-child(5n+2) { color: var(--coral); }
  .letter:nth-child(5n+3) { color: var(--green); }
  .letter:nth-child(5n+4) { color: #D99A00; }
  .letter:nth-child(5n) { color: var(--purple); }
  .letter.on { background: var(--yellow-soft); transform: scale(.92); }
  .big-letter { font: 700 5rem 'Fredoka', sans-serif; line-height: 1; color: var(--blue); }
  .big-letter span { color: var(--coral); font-size: 3.6rem; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; margin: 0 -16px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; width: 56px; height: 56px; border-radius: 16px; background: var(--surface);
    box-shadow: var(--shadow); font: 700 1.6rem 'Fredoka', sans-serif;
  }
  .chip.on { background: var(--blue); color: #fff; }
  .syllables { display: grid; gap: 10px; }
  .syl {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 14px; padding: 12px 18px; text-align: left;
  }
  .syl b { font: 700 2.4rem 'Fredoka', sans-serif; min-width: 2.4em; color: var(--blue); }
  .syl span { font-size: .95rem; color: var(--muted); flex: 1; }
  .syl .e { font-size: 2rem; flex: 0; }
  .syl.on { background: var(--yellow-soft); }

  /* BOTOES */
  .btn {
    display: block; width: 100%; background: var(--green); color: #fff; text-align: center;
    font: 700 1.15rem 'Fredoka', sans-serif; padding: 16px; border-radius: var(--radius);
    box-shadow: 0 6px 0 var(--green-dark); margin-top: 14px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--green-dark); }
  .btn.light { background: var(--surface); color: var(--ink); box-shadow: 0 6px 0 var(--line); }
  .btn.blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-dark); }
  .link { display: block; width: 100%; text-align: center; margin-top: 14px; color: var(--muted); text-decoration: underline; font-size: .9rem; }

  /* FIM DE JOGO */
  .end { text-align: center; padding-top: 12px; }
  .end .emoji { font-size: 6rem; }
  .end h2 { font-size: 2rem; margin: 8px 0 4px; }
  .end .got { font-size: 3rem; letter-spacing: 6px; margin: 6px 0; }
  .end .got span { display: inline-block; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) backwards; }
  .end p { color: var(--muted); }
  .new-sticker {
    margin: 18px auto 0; max-width: 260px; background: var(--yellow-soft); border: 3px dashed var(--yellow);
    border-radius: var(--radius); padding: 14px;
  }
  .new-sticker small { font: 700 .85rem 'Fredoka', sans-serif; text-transform: uppercase; color: #8A5A00; letter-spacing: .5px; }
  .new-sticker .pop { font-size: 4.2rem; line-height: 1.2; animation-delay: .3s; animation-fill-mode: backwards; }
  .new-sticker b { font: 700 1.1rem 'Fredoka', sans-serif; display: block; }

  /* ALBUM */
  .album-head { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 4px 0 16px; }
  .album-head p { font-size: .9rem; color: var(--muted); margin-top: 8px; }
  .album { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sticker {
    aspect-ratio: 1; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
    display: grid; place-items: center; font-size: 2.4rem; transition: transform .15s;
  }
  .sticker.locked { background: var(--line); box-shadow: none; color: #C9C1B3; font: 700 1.6rem 'Fredoka', sans-serif; }
  .sticker.wiggle { animation: wiggle .5s; }
  @keyframes wiggle { 25% { transform: rotate(-12deg) scale(1.15); } 75% { transform: rotate(12deg) scale(1.15); } }

  /* BOAS-VINDAS E AREA DOS PAIS */
  .onb { text-align: center; padding-top: calc(36px + env(safe-area-inset-top)); }
  .onb .mascot { font-size: 6rem; display: inline-block; }
  .onb h2 { font-size: 1.8rem; margin: 10px 0 4px; }
  .onb p { color: var(--muted); margin: 14px 0 8px; font-weight: 500; }
  .field {
    width: 100%; padding: 16px; border-radius: 16px; border: 3px solid var(--line); background: var(--surface);
    font: 600 1.3rem 'Fredoka', sans-serif; text-align: center; color: var(--ink); outline: none;
  }
  .field:focus { border-color: var(--blue); }
  .avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .avatars button { aspect-ratio: 1; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-size: 2.2rem; border: 3px solid transparent; }
  .avatars button.on { border-color: var(--blue); background: var(--blue-soft); }
  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .panel h3 { font-size: 1.15rem; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
  .row:first-of-type { border-top: 0; }
  .row .grow { flex: 1; }
  .row .muted { color: var(--muted); font-size: .85rem; }
  .switch { width: 54px; height: 32px; border-radius: 999px; background: var(--line); position: relative; flex-shrink: 0; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(22px); }
  .tips { padding-left: 20px; display: grid; gap: 8px; font-size: .93rem; color: var(--muted); }
  .tips b { color: var(--ink); }
  .danger { color: var(--coral); font-weight: 600; text-decoration: underline; font-size: .9rem; }

  /* CONFETE */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .confetti i { position: absolute; top: -40px; font-style: normal; font-size: 1.8rem; animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .6; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" hidden>
  <div class="nav-in">
    <button data-go="" data-tab="home"><span>🏠</span>Início</button>
    <button data-go="#/album" data-tab="album"><span>🏆</span>Álbum</button>
    <button data-go="#/pais" data-tab="pais"><span>👨‍👩‍👧</span>Pais</button>
  </div>
</nav>

  var ALPHABET = [

    html += '</div>';

    html += '<div class="panel"><h3>⚙️ Configurações</h3>' +
      '<div class="row"><div class="grow">Voz que fala com a criança<div class="muted">Lê as perguntas em voz alta</div></div><button class="switch' + (data.settings.voice ? ' on' : '') + '" data-set="voice" aria-label="Voz"></button></div>' +
      '<div class="row"><div class="grow">Sons de efeito<div class="muted">Sons de acerto e erro</div></div><button class="switch' + (data.settings.sound ? ' on' : '') + '" data-set="sound" aria-label="Sons"></button></div></div>';

    html += '<div class="panel"><h3>💡 Como usar melhor</h3><ul class="tips">' +
      '<li><b>10 a 15 minutos por dia</b> rendem mais que uma hora no fim de semana.</li>' +
      '<li>Siga a <b>ordem da trilha</b> (Ouvir → Letras → Sílabas → Ler). O botão "Continuar" já mostra o próximo passo.</li>' +
      '<li>Use junto com as <b>folhas impressas</b> do kit: a brincadeira no celular reforça o que a criança fez no papel.</li>' +
      '<li>Se a criança errar muito, <b>volte uma etapa</b>. Repetir faz parte do aprendizado.</li>' +
      '<li>Comemore cada figurinha nova junto com ela. 🎉</li></ul></div>';

    html += '<div style="text-align:center;margin:8px 0 4px"><button class="danger" id="reset">Apagar todo o progresso</button></div>';
    show(html, 'pais');

    app.querySelectorAll('[data-set]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.set;
        data.settings[k] = !data.settings[k];
        b.classList.toggle('on', data.settings[k]);
        save();
        if (data.settings[k]) { soundTap(); if (k === 'voice') say('Voz ligada!'); }
      });
    });
    $('reset').onclick = function () {
      if (!confirm('Apagar estrelas, figurinhas e o perfil? Isso não pode ser desfeito.')) return;
      data = { profile: null, games: {}, stickers: [], streak: { last: '', count: 0 }, daily: '', settings: data.settings };
      save();
      location.hash = '';
      route();
    };
  }

  // ---------- EXPLORAR: ALFABETO ----------
  function renderAlphabet() {
    var g = meta('alfabeto');
    gameData('alfabeto').visited = true; save();
    var html = topBar(g.title, g.desc, true);
    html += '<div class="card" id="alpha-card"><div class="question">Toque em uma letra 👇</div><div class="emoji">🔤</div></div>';
    html += '<div class="letters">';
    ALPHABET.forEach(function (l, i) { html += '<button class="letter" data-i="' + i + '">' + l[0] + '</button>'; });
    html += '</div>';
    show(html, null);
    app.querySelectorAll('.letter').forEach(function (b) {
      b.addEventListener('click', function () {
        var l = ALPHABET[+b.dataset.i];
        app.querySelectorAll('.letter.on').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        $('alpha-card').innerHTML =
          '<div class="big-letter">' + l[0] + ' <span>' + l[0].toLowerCase() + '</span></div>' +
          '<div class="emoji pop">' + l[3] + '</div>' +
          '<div class="word">' + l[0] + ' de ' + up(l[2]) + '</div>' +
          '<button class="speak" id="again">🔊 Ouvir de novo</button>';
        var text = l[1] + '. ' + l[1] + ' de ' + l[2];
        say(text);
        $('again').onclick = function () { say(text); };
      });
    });
  }

  // ---------- EXPLORAR: FAMILIAS SILABICAS ----------
  function renderFamilies(letter) {
    var g = meta('familias');
    gameData('familias').visited = true; save();
    var html = topBar(g.title, 'Escolha a letra e toque na sílaba', true);
    html += '<div class="chips">';
    Object.keys(FAMILIES).forEach(function (k) {
      html += '<button class="chip' + (k === letter ? ' on' : '') + '" data-l="' + k + '">' + k + '</button>';
    });
    html += '</div><div class="syllables">';
    FAMILIES[letter].forEach(function (s, i) {
      html += '<button class="syl" data-i="' + i + '"><b>' + up(s[0]) + '</b><span>' + s[1] + '</span><span class="e">' + (s[2] || '') + '</span></button>';
    });
    html += '</div><button class="btn" id="all">🔊 Ouvir a família toda</button>';
    show(html, null);

    function sayAll(l) { say(FAMILIES[l].map(function (s) { return s[0]; }).join(', ')); }
    app.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () { renderFamilies(c.dataset.l); sayAll(c.dataset.l); });
    });
    app.querySelectorAll('.syl').forEach(function (b) {
      b.addEventListener('click', function () {
        var s = FAMILIES[letter][+b.dataset.i];
        app.querySelectorAll('.syl.on').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        say(s[1] ? s[0] + '. ' + s[0] + ' de ' + s[1] : s[0]);
      });
    });
    $('all').onclick = function () { sayAll(letter); };
    var on = app.querySelector('.chip.on');
    if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  // ---------- QUIZ: GERADORES DE RODADA ----------
  // Cada gerador devolve: { key, q, show, speak, options: [{html, ok}], cols } ou { ..., build } no Monte a Palavra
  function syllablePool(exclude) {
    var pool = [];
    WORDS.forEach(function (x) { x.s.forEach(function (s) { if (exclude.indexOf(s) < 0 && s.length <= 3 && pool.indexOf(s) < 0) pool.push(s); }); });
    return pool;
  }

  var GEN = {
    rimas: function () {
      var grp = pick(RHYMES);
      var pair = sample(grp, 2);
      var others = shuffle(RHYMES.filter(function (r) { return r !== grp; })).slice(0, 2).map(function (r) { return pick(r); });
      return {
        key: pair[0][0],
        q: 'O que rima com...',
        show: '<div class="emoji">' + pair[0][1] + '</div><div class="word">' + up(pair[0][0]) + '</div>',
        speak: 'O que rima com ' + pair[0][0] + '?',
        cols: 3,
        options: shuffle([{ w: pair[1], ok: true }].concat(others.map(function (o) { return { w: o, ok: false }; })))
          .map(function (o) { return { html: '<span class="e">' + o.w[1] + '</span><small>' + up(o.w[0]) + '</small>', ok: o.ok }; })
      };
    },
    silabas: function () {
      var w = pick(WORDS);
      var n = w.s.length;
      return {
        key: w.w,
        q: 'Quantos pedacinhos tem?',
        show: '<div class="emoji">' + w.e + '</div><div class="word">' + up(w.w) + '</div>',
        speak: w.w + '. Bata palmas e conte: quantos pedacinhos tem ' + w.w + '?',
        cols: 2,
        options: [1, 2, 3, 4].map(function (k) { return { html: k + '<small>' + '👏'.repeat(k) + '</small>', ok: k === n }; }),
        fill: w.s.map(up).join('-')
      };
    },
    inicial: function () {
      var w = pick(WORDS);
      var L = initial(w.w);
      var pool = 'ABCDFGJLMNOPRSTUVZ'.split('').filter(function (x) { return x !== L; });
      return {
        key: w.w,
        q: 'Com qual letra começa?',
        show: '<div class="emoji">' + w.e + '</div><div class="word" style="font-size:1.6rem;color:var(--muted)">' + '_ '.repeat(w.w.length) + '</div>',
        speak: w.w + '. Com qual letra começa ' + w.w + '?',
        cols: 3,
        options: shuffle([L].concat(sample(pool, 2))).map(function (x) { return { html: x, ok: x === L }; }),
        fill: up(w.w)
      };
    },
    completa: function () {
      var w = pick(WORDS.filter(function (x) { return x.s.length === 2; }));
      var miss = Math.random() < 0.5 ? 0 : 1;
      var right = w.s[miss];
      var opts = shuffle([right].concat(sample(syllablePool([right]), 2)));
      return {
        key: w.w,
        q: 'Qual pedacinho está faltando?',
        show: '<div class="emoji">' + w.e + '</div><div class="word">' + w.s.map(function (s, i) { return i === miss ? '<span class="blank">?</span>' : up(s); }).join('') + '</div>',
        speak: w.w + '. Qual pedacinho está faltando?',
        cols: 3,
        options: opts.map(function (s) { return { html: up(s), ok: s === right }; }),
        fill: up(w.w)
      };
    },
    montar: function () {
      var w = pick(WORDS.filter(function (x) { return x.s.length >= 2 && x.s.length <= 3; }));
      return {
        key: w.w,
        q: 'Monte a palavra',
        show: '<div class="emoji">' + w.e + '</div><div class="slots">' + w.s.map(function () { return '<span class="slot"></span>'; }).join('') + '</div>',
        speak: w.w + '. Toque nas sílabas na ordem certa para montar ' + w.w + '.',
        build: { parts: w.s, tiles: shuffle(w.s.concat(sample(syllablePool(w.s), 1))) },
        word: w.w
      };
    },
    leitura: function () {
      var w = pick(WORDS.filter(function (x) { return x.s.length <= 3; }));
      var others = sample(WORDS, 2, function (x) { return x.w === w.w; });
      return {
        key: w.w,
        q: 'Leia a palavra e toque na figura',
        show: '<div class="word" style="font-size:2.8rem">' + up(w.w) + '</div>',
        speak: 'Leia a palavra e toque na figura certa.',
        hint: w.w,
        cols: 3,
        options: shuffle([w].concat(others)).map(function (x) { return { html: '<span class="e" style="font-size:3.4rem">' + x.e + '</span>', ok: x.w === w.w }; })
      };
    },
    ditado: function () {
      var w = pick(WORDS.filter(function (x) { return x.s.length <= 3; }));
      // distratores parecidos (mesma silaba inicial ou mesmo final) deixam a leitura de verdade
      var alike = WORDS.filter(function (x) { return x.w !== w.w && (x.s[0] === w.s[0] || x.w.slice(-2) === w.w.slice(-2)); });
      var others = sample(alike, 2);
      if (others.length < 2) others = others.concat(sample(WORDS, 2 - others.length, function (x) { return x.w === w.w || others.indexOf(x) >= 0; }));
      return {
        key: w.w,
        q: 'Ouça e toque na palavra certa',
        show: '<div class="emoji">👂</div>',
        speak: 'Toque na palavra: ' + w.w,
        cols: 1,
        options: shuffle([w].concat(others)).map(function (x) { return { html: up(x.w), ok: x.w === w.w }; }),
        reveal: w.e
      };
    }
  };

  // ---------- QUIZ: MOTOR ----------
  var state = null;

  function startQuiz(id) {
    state = { id: id, rounds: id === DAILY.id ? DAILY_ROUNDS : ROUNDS, round: 0, score: 0, results: [], recent: [] };
    nextRound();
  }

  function nextRound() {
    if (state.round >= state.rounds) return renderEnd();
    var r, tries = 0;
    // evita repetir a mesma palavra em rodadas seguidas
    do {
      var gid = state.id === DAILY.id ? pick(QUIZ_IDS) : state.id;
      r = GEN[gid](); r.gid = gid; tries++;
    } while (state.recent.indexOf(r.key) >= 0 && tries < 12);
    state.recent.push(r.key);
    if (state.recent.length > 5) state.recent.shift();
    state.current = r;
    state.firstTry = true;
    state.locked = false;
    state.bi = 0;
    renderRound();
    setTimeout(function () { say(r.speak); }, 250);
  }

  function renderRound() {
    var g = meta(state.id);
    var r = state.current;
    var sub = state.id === DAILY.id ? meta(r.gid).title + ' · ' : '';
    var html = topBar(g.title, sub + 'Rodada ' + (state.round + 1) + ' de ' + state.rounds, true);
    html += '<div class="progress">';
    for (var i = 0; i < state.rounds; i++) {
      html += '<i class="' + (i < state.round ? (state.results[i] ? 'done' : 'miss') : i === state.round ? 'now' : '') + '"></i>';
    }
    html += '</div>';
    html += '<div class="card"><div class="question">' + r.q + '</div><div id="show">' + r.show + '</div>' +
      '<button class="speak" id="speak">🔊 ' + (r.hint ? 'Ouvir dica' : 'Ouvir de novo') + '</button></div>';
    if (r.build) {
      html += '<div class="tiles">' + r.build.tiles.map(function (t, i) { return '<button class="tile" data-i="' + i + '">' + up(t) + '</button>'; }).join('') + '</div>';
    } else {
      html += '<div class="options cols-' + r.cols + '">' + r.options.map(function (o, i) { return '<button class="opt" data-i="' + i + '">' + o.html + '</button>'; }).join('') + '</div>';
    }
    html += '<div class="feedback" id="fb"></div>';
    show(html, null);

    $('speak').onclick = function () { say(r.hint || r.speak); };
    if (r.build) {
      app.querySelectorAll('.tile').forEach(function (b) {
        b.addEventListener('click', function () { buildTap(b, r.build.tiles[+b.dataset.i]); });
      });
    } else {
      app.querySelectorAll('.opt').forEach(function (b) {
        b.addEventListener('click', function () {
          if (state.locked) return;
          if (r.options[+b.dataset.i].ok) success(b); else miss(b);
        });
      });
    }
  }

  function buildTap(btn, syl) {
    if (state.locked) return;
    var parts = state.current.build.parts;
    if (syl !== parts[state.bi]) return miss(btn);
    var slot = app.querySelectorAll('.slot')[state.bi];
    slot.textContent = up(syl);
    slot.classList.add('filled');
    btn.classList.add('used');
    state.bi++;
    soundTap();
    say(syl);
    $('fb').textContent = '';
    if (state.bi === parts.length) success(null);
  }

  function success(btn) {
    var r = state.current;
    state.locked = true;
    if (btn) btn.classList.add('right');
    state.results[state.round] = state.firstTry;
    if (state.firstTry) state.score++;
    var word = $('show').querySelector('.word');
    if (r.fill && word) word.textContent = r.fill;
    var em = $('show').querySelector('.emoji');
    if (r.reveal && em) { em.textContent = r.reveal; em.classList.add('pop'); }
    var p = praise();
    var fb = $('fb');
    fb.className = 'feedback ok'; fb.textContent = '🎉 ' + p;
    soundRight();
    say(r.word ? r.word + '! ' + p : p);
    state.round++;
    setTimeout(nextRound, r.word ? 1900 : 1500);
  }

  function miss(btn) {
    state.firstTry = false;
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
    var fb = $('fb');
    fb.className = 'feedback no'; fb.textContent = 'Quase! Tente de novo 💪';
    soundWrong();
    say('Quase! Tente de novo.');
  }

  function renderEnd() {
    var g = meta(state.id);
    var isDaily = state.id === DAILY.id;
    var ratio = state.score / state.rounds;
    var stars = ratio >= 0.85 ? 3 : ratio >= 0.5 ? 2 : 1;
    var sticker = null;

    bumpStreak();
    if (isDaily) {
      var firstToday = data.daily !== dayKey(0);
      data.daily = dayKey(0);
      if (firstToday) sticker = awardSticker();
    } else {
      var d = gameData(state.id);
      d.plays++;
      if (stars > d.best) d.best = stars;
      if (stars >= 2) sticker = awardSticker();
    }
    save();

    var name = childName();
    var html = topBar(g.title, 'Fim da brincadeira', true);
    html += '<div class="end"><div class="emoji pop">' + (stars === 3 ? '🏆' : stars === 2 ? '🥳' : '😊') + '</div>' +
      '<h2>' + (stars === 3 ? 'Incrível' : stars === 2 ? 'Muito bem' : 'Bom trabalho') + (name ? ', ' + esc(name) : '') + '!</h2>' +
      '<div class="got">' + [0, 1, 2].map(function (i) { return '<span style="animation-delay:' + (0.2 + i * 0.2) + 's">' + (i < stars ? '⭐' : '☆') + '</span>'; }).join('') + '</div>' +
      '<p>Acertou ' + state.score + ' de ' + state.rounds + ' de primeira.' + (stars < 2 && !isDaily ? '<br>Faça 2 estrelas para ganhar uma figurinha!' : '') + '</p>' +
      (sticker ? '<div class="new-sticker"><small>🎁 Nova figurinha!</small><div class="pop">' + sticker[0] + '</div><b>' + sticker[1] + '</b></div>' : '');
    var next = nextGame();
    if (stars >= 2 && next && next.id !== state.id && !isDaily) {
      html += '<button class="btn blue" data-go="#/' + next.id + '">▶ Próxima: ' + next.title + '</button>';
    }
    html += '<button class="btn" id="again">🔁 Brincar de novo</button>' +
      (sticker ? '<button class="btn light" data-go="#/album">🏆 Ver meu álbum</button>' : '<button class="btn light" data-go="">🏠 Voltar ao início</button>') +
      '</div>';
    show(html, null);
    $('again').onclick = function () { startQuiz(state.id); };
    confetti();
    soundWin();
    say((stars === 3 ? 'Incrível! ' : 'Muito bem! ') + 'Você ganhou ' + stars + (stars > 1 ? ' estrelas!' : ' estrela!') + (sticker ? ' E uma figurinha nova: ' + sticker[1] + '!' : ''));
  }

  // ============ ROTAS ============
  // Usa o #hash para o botao "voltar" do celular funcionar
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (!t) return;
    var to = t.dataset.go;
    if (location.hash === to || (to === '' && location.hash.length < 2)) route();
    else location.hash = to;
  });

  function route() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    window.scrollTo(0, 0);
    var id = location.hash.replace('#/', '').replace('#', '');
    if (!data.profile) return renderWelcome(false);
    if (id === 'perfil') return renderWelcome(true);
    if (id === 'album') return renderAlbum();
    if (id === 'pais') return renderParents();
    if (id === DAILY.id) return startQuiz(DAILY.id);
    if (id === 'alfabeto') return renderAlphabet();
    if (id === 'familias') return renderFamilies('B');
    if (GEN[id]) return startQuiz(id);
    renderHome();
  }
  window.addEventListener('hashchange', route);
  route();
</script>
